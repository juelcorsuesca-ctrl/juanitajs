<script>
    const numero = 42;
try {
  numero(); // Lanza TypeError porque un numero no es una funcion
} catch (error) {
  console.log(error.name + ": " + error.message);
}

</script>
<script>

  const arr = new Array(-5); // Lanza RangeError porque el tamano del arreglo no puede ser negativo
} catch (error) {
  console.log(error.name + ": " + error.message);
}

</script>
<script>

}
